<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>카드 뉴스 미리보기 — 교사용</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="cardnews.css">
<style>
  .picker{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0 18px;}
  .picker select{border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:16px;font-family:inherit;min-width:320px;}
  .keybox{background:#FFF8E9;border:1px solid #E8D5A6;border-radius:12px;padding:13px 18px;margin:0 0 18px;font-size:15px;color:#6B5423;}
  .keybox b{color:#5A4418;}
  .keybox.hide{display:none;}
  .srcs{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-top:18px;}
  .srcs h3{margin:0 0 10px;font-size:16px;color:var(--ink2);}
  .srcs div{padding:7px 0;border-bottom:1px solid #F1F4F7;font-size:15px;}
  .srcs div:last-child{border-bottom:0;}
  .srcs a{color:var(--accent);font-weight:600;}
  .srcs .none{color:#A6B2BD;}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="title">카드 뉴스 미리보기</h1>
  <p class="lead">교사용입니다. 모둠을 고르거나 확정하지 않고 아홉 편을 모두 살펴볼 수 있습니다. 출처 링크도 그대로 작동합니다.</p>

  <div class="picker">
    <select id="sel"></select>
    <span class="viewtoggle"><button id="vSlide" class="on">한 장씩</button><button id="vGrid">모두 보기</button></span>
    <label style="display:flex;align-items:center;gap:7px;font-size:15px;margin-left:auto">
      <input type="checkbox" id="showKey" style="width:18px;height:18px"> 문제 자리 보기
    </label>
  </div>

  <div class="keybox hide" id="keybox"></div>

  <div class="stage one" id="stage">
    <button class="navbtn prev" id="prev">‹</button>
    <div class="deck skin-a slide" id="deck"></div>
    <button class="navbtn next" id="next">›</button>
  </div>
  <div class="dots" id="dots"></div>

  <div class="srcs" id="srcs"></div>
  <div class="bar"><a class="btn" href="teacher.html">교사용 화면으로</a></div>
</div>

<script src="data.js"></script>
<script src="motifs.js"></script>
<script src="render.js"></script>
<script>
var KEY={
 1:{pair:'근거①',what:'출처가 개인 블로그'},
 2:{pair:'근거②',what:'출처가 개인 블로그'},
 3:{pair:'근거②',what:'출처 표기가 없음'},
 4:{pair:'근거①',what:'이유(눈 건강)와 관련 없음'},
 6:{pair:'근거②',what:'불법복제물 이용률은 현황일 뿐, 함부로 쓰면 안 되는 까닭이 아님'},
 7:{pair:'근거①',what:'2012년 자료. 그 제도는 2021년에 폐지되었고 게임 이름도 지금과 다름'},
 9:{pair:'이유①',what:'이용자가 많다는 것이 조심할 까닭은 아님'},
 10:{pair:'근거①',what:'출처 표기가 없음'},
 12:{pair:'근거②',what:'2008년 기준 수치 — 16년 전 자료'}
};
function $(s){return document.querySelector(s);}
var mode='slide';

var sel=$('#sel');
NEWS.forEach(function(n){var o=el('option',null,n.id+'편. '+n.claim);o.value=n.id;sel.appendChild(o);});

function cur(){return newsById(parseInt(sel.value,10));}
function draw(){
  var n=cur();
  buildDeck($('#deck'),n,{},null);
  var k=KEY[n.id]||{};
  $('#keybox').innerHTML='<b>'+(k.pair||'')+'</b> — '+(k.what||'');
  var w=$('#srcs');w.innerHTML='';
  w.appendChild(el('h3',null,'출처 확인'));
  [['근거①','e1'],['근거②','e2']].forEach(function(p){
    var ev=n[p[1]], row=el('div');
    row.appendChild(document.createTextNode(p[0]+' · '));
    if(ev.href){var a=el('a',null,ev.label);a.href=ev.href;a.target='_blank';a.rel='noopener';row.appendChild(a);}
    else row.appendChild(el('span','none','출처 표기 없음'));
    w.appendChild(row);
  });
  setMode(mode);
}
function setMode(m){
  mode=m;var slide=(m==='slide');
  $('#deck').className='deck skin-a'+(slide?' slide':'');
  $('#stage').classList.toggle('one',slide);
  $('#vSlide').classList.toggle('on',slide);
  $('#vGrid').classList.toggle('on',!slide);
  ['#prev','#next','#dots'].forEach(function(q){$(q).style.display=slide?'':'none';});
  if(slide)go(0);
}
function idx(){var d=$('#deck');if(!d.children.length)return 0;
  return Math.round(d.scrollLeft/(d.children[0].offsetWidth+26));}
function go(i){var d=$('#deck');if(!d.children.length)return;
  i=Math.max(0,Math.min(3,i));
  if(d.scrollTo)d.scrollTo({left:i*(d.children[0].offsetWidth+26),behavior:'smooth'});else d.scrollLeft=i*(d.children[0].offsetWidth+26);dots(i);}
function dots(i){
  if(i==null)i=idx();
  var w=$('#dots');w.innerHTML='';
  for(var k=0;k<4;k++)(function(k){
    var b=el('button',k===i?'on':'');b.onclick=function(){go(k);};w.appendChild(b);})(k);
  $('#prev').disabled=(i===0);$('#next').disabled=(i===3);
}
sel.onchange=draw;
$('#vSlide').onclick=function(){setMode('slide');};
$('#vGrid').onclick=function(){setMode('grid');};
$('#prev').onclick=function(){go(idx()-1);};
$('#next').onclick=function(){go(idx()+1);};
$('#deck').addEventListener('scroll',function(){if($('#deck').classList.contains('slide'))dots();});
$('#showKey').onchange=function(){$('#keybox').classList.toggle('hide',!this.checked);};
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight')go(idx()+1);
  if(e.key==='ArrowLeft')go(idx()-1);});
draw();
</script>
</body>
</html>
