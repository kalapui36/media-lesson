<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>가짜 블로그 설정</title>
<link rel="stylesheet" href="style.css">
<style>
  .tsec{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 24px;margin-bottom:14px;max-width:820px;}
  .netline{display:flex;align-items:center;gap:4px;margin:0 0 16px;}
  .brow{display:grid;grid-template-columns:118px 1fr;gap:18px;align-items:start;}
  .bpic{width:118px;height:118px;border-radius:50%;object-fit:cover;background:#E8ECEF;
    display:grid;place-items:center;color:#9AA7B2;font-size:13px;text-align:center;}
  .bfields .lab{font-size:13px;color:var(--ink2);margin:0 0 4px;}
  .bfields input[type=text]{width:100%;border:1px solid var(--line);border-radius:9px;
    padding:10px 12px;font-size:16px;font-family:inherit;margin-bottom:10px;}
  .brow h3{margin:0 0 12px;font-size:18px;}
  .row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:6px;}
  .row input[type=file]{font-size:14px;max-width:240px;}
  .bmsg{font-size:14px;color:var(--ink2);}
  .bsize{width:118px;text-align:center;font-size:13px;color:#8C98A4;margin-top:7px;}
  .bmsg.ok{color:#2C6B45;font-weight:600;}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="title">가짜 블로그 설정</h1>
  <p class="lead">블로그 이름, 글쓴이, 소개, 프로필 사진을 정합니다.</p>
  <div class="netline"><span class="netdot" id="netdot"></span><span id="netmsg" class="hint"></span></div>

  <div id="blogs"></div>

  <div class="bar"><a class="btn primary" href="teacher.html">교사용 화면으로</a></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="sync.js"></script>
<script>
function $(s){return document.querySelector(s);}
var blogs={};
var BLOGDEF={
  health:{title:'1편 운동 — 근거①', blog:'○○의 하루하루', name:'○○', bio:'달리기랑 축구를 좋아합니다'},
  meal:  {title:'2편 급식 — 근거②', blog:'△△의 급식 일기', name:'△△', bio:'급식 시간이 제일 기다려집니다'}
};

Sync.init();
Sync.onState(function(on){
  $('#netdot').className='netdot'+(on?' on':'');
  $('#netmsg').textContent=on?'연결됨':'연결되지 않았습니다. 연결된 뒤에 저장하세요.';
});
Sync.onBlogs(function(b){ blogs=b||{}; draw(); });

/* 고른 사진을 200픽셀 정사각으로 줄인다 */
function shrink(file,cb){
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var S=200,c=document.createElement('canvas');
      c.width=S;c.height=S;
      var x=img.width,y=img.height,side=Math.min(x,y);
      c.getContext('2d').drawImage(img,(x-side)/2,(y-side)/2,side,side,0,0,S,S);
      cb(c.toDataURL('image/jpeg',0.82));
    };
    img.onerror=function(){cb(null);};
    img.src=fr.result;
  };
  fr.onerror=function(){cb(null);};
  fr.readAsDataURL(file);
}

function draw(){
  var w=$('#blogs');w.innerHTML='';
  Object.keys(BLOGDEF).forEach(function(key){
    var def=BLOGDEF[key], cur=blogs[key]||{}, pending=cur.photo||'';
    var box=document.createElement('div');box.className='tsec';
    var h=document.createElement('h3');h.textContent=def.title;box.appendChild(h);
    var row=document.createElement('div');row.className='brow';

    var picWrap=document.createElement('div');
    var size=document.createElement('div');size.className='bsize';
    function setPic(src){
      picWrap.innerHTML='';
      var e;
      if(src){e=document.createElement('img');e.className='bpic';e.src=src;}
      else{e=document.createElement('div');e.className='bpic';e.textContent='사진 없음';}
      picWrap.appendChild(e);
      size.textContent=src?(Math.round(src.length/1024)+'KB'):'';
      picWrap.appendChild(size);
    }
    setPic(pending);
    row.appendChild(picWrap);

    var f=document.createElement('div');f.className='bfields';
    function fld(labText,ph,val){
      var l=document.createElement('div');l.className='lab';l.textContent=labText;f.appendChild(l);
      var i=document.createElement('input');i.type='text';i.placeholder=ph;i.value=val||'';
      f.appendChild(i);return i;
    }
    var iBlog=fld('블로그 이름',def.blog,cur.blog);
    var iName=fld('글쓴이',def.name,cur.name);
    var iBio =fld('소개',def.bio,cur.bio);

    var r=document.createElement('div');r.className='row';
    var file=document.createElement('input');file.type='file';file.accept='image/*';
    var save=document.createElement('button');save.className='btn primary';save.textContent='저장';
    var del=document.createElement('button');del.className='btn';del.textContent='사진 지우기';
    var msg=document.createElement('span');msg.className='bmsg';

    file.onchange=function(){
      if(!file.files[0])return;
      msg.className='bmsg';msg.textContent='줄이는 중…';
      shrink(file.files[0],function(d){
        if(!d){msg.textContent='사진을 읽지 못했습니다.';return;}
        pending=d;setPic(d);
        msg.textContent='저장을 누르면 반영됩니다.';
      });
    };
    function put(photo,done){
      if(!Sync.online){msg.className='bmsg';msg.textContent='연결되지 않았습니다.';return;}
      Sync.saveBlog(key,{blog:iBlog.value.trim()||def.blog,
                         name:iName.value.trim()||def.name,
                         bio:iBio.value.trim()||def.bio,
                         photo:photo||''},done);
    }
    save.onclick=function(){
      save.disabled=true;msg.className='bmsg';msg.textContent='저장하는 중…';
      put(pending,function(ok){
        save.disabled=false;
        msg.className='bmsg'+(ok?' ok':'');
        msg.textContent=ok?'저장했습니다.':'저장하지 못했습니다.';
      });
    };
    del.onclick=function(){
      if(!confirm('이 블로그의 사진을 지웁니다.'))return;
      pending='';setPic('');
      put('',function(ok){
        msg.className='bmsg'+(ok?' ok':'');
        msg.textContent=ok?'사진을 지웠습니다.':'지우지 못했습니다.';
      });
    };
    r.appendChild(file);r.appendChild(save);r.appendChild(del);r.appendChild(msg);
    f.appendChild(r);
    row.appendChild(f);box.appendChild(row);w.appendChild(box);
  });
}
draw();

/* 화면 사이를 오갈 때 지금 방(?room=)을 그대로 들고 간다 */
(function(){
  function q(){
    try{
      var r=new URLSearchParams(location.search).get('room');
      var d=(typeof FB_ROOM_DEFAULT!=='undefined')?FB_ROOM_DEFAULT:'';
      if(r&&r!==d)return '?room='+encodeURIComponent(r);
    }catch(e){}
    return '';
  }
  var s=q(); if(!s)return;
  document.querySelectorAll('a[href]').forEach(function(a){
    var h=a.getAttribute('href');
    if(!h||/^(https?:|mailto:|#)/.test(h))return;
    if(h.indexOf('?')>=0)return;
    a.setAttribute('href',h+s);
  });
})();
</script>
</body>
</html>
